name: docker

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    env:
      # The container image exports BUNDLE_GEMFILE=/setup/Gemfile (its
      # released stack); point bundler at this repo's git-pinned Gemfile
      # so the unreleased IALA flavor is available.
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Metanorma version
        run: metanorma --version

      # The IALA flavor is not yet released: install the repo's
      # git-pinned stack into the container before building under
      # bundler (mn-samples-plateau-cg3 pattern).
      - name: Install the repo bundle
        run: bundle install --jobs 4

      - name: Cache or generate Metanorma XML
        uses: actions-mn/build-and-publish@v2
        with:
          agree-to-terms: true
          use-bundler: true
          destination: artifact
          artifact-name: mn
          cache-site-for-manifest: metanorma.yml

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Make dist dir
        run: mkdir dist

      - name: Download Metanorma artifacts
        uses: actions/download-artifact@v4
        with:
          name: mn
          path: dist

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
